<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>earthnic · Catalog</title>
  <link rel="icon" href="logo.jpeg" type="image/jpeg" />
  <style>
    :root {
      --bg-dark: #1a3b2b;
      --bg-light: #ffffff;
      --text-dark: #121212;
      --text-light: #ffffff;
      --text-muted: #666666;
      --accent-gray: #f4f4f4;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --header-height: 60px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-light);
      color: var(--text-dark);
      line-height: 1.5;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--header-height);
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .menu-btn span {
      display: block;
      width: 20px;
      height: 2px;
      background-color: var(--text-light);
    }

    .est-tag {
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      font-weight: 300;
      opacity: 0.8;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: lowercase;
      border-bottom: 2px solid var(--text-light);
      padding-bottom: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
      position: relative;
    }

    .cart-icon-wrapper {
      position: relative;
      cursor: pointer;
    }

    .cart-icon {
      width: 22px;
      height: 22px;
      stroke: var(--text-light);
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #e74c3c;
      color: white;
      font-size: 0.6rem;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .nav-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: rgba(26, 59, 43, 0.96);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .nav-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 2.6rem;
      cursor: pointer;
      line-height: 1;
    }

    .nav-links {
      list-style: none;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .nav-links a {
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
      transition: opacity 0.2s;
      border-bottom: 1px solid transparent;
      padding-bottom: 4px;
    }

    .nav-links a:hover {
      opacity: 0.7;
      border-bottom-color: rgba(255,255,255,0.3);
    }

    .catalog-section {
      padding: 80px 20px 60px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 40px;
      color: #1a3b2b;
      position: relative;
      display: inline-block;
      left: 50%;
      transform: translateX(-50%);
    }

    .section-title::before,
    .section-title::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 50px;
      height: 1px;
      background-color: #1a3b2b;
      opacity: 0.3;
    }

    .section-title::before { right: 100%; margin-right: 20px; }
    .section-title::after { left: 100%; margin-left: 20px; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 30px;
    }

    .product-card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      border: 1px solid #f0f0f0;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.10);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #eaeaea;
      background-size: cover;
      background-position: center;
    }

    .product-info {
      padding: 16px 18px 20px;
    }

    .product-name {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
      color: #1a3b2b;
    }

    .product-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 4px;
    }

    .product-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1a3b2b;
    }

    .product-quality {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: #f5f5f5;
      padding: 2px 10px;
      border-radius: 20px;
      display: inline-block;
    }

    .product-gender {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
      display: inline-block;
      background: #f0f7f2;
      padding: 2px 12px;
      border-radius: 20px;
      color: #1a3b2b;
    }

    .btn-add {
      display: inline-block;
      margin-top: 12px;
      padding: 7px 22px;
      background: #1a3b2b;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background: #2a5a3f;
    }

    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .cart-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .cart-sidebar {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      max-width: 90vw;
      height: 100%;
      background: #ffffff;
      z-index: 3001;
      padding: 20px;
      transition: right 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 20px rgba(0,0,0,0.1);
    }

    .cart-sidebar.open {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
      margin-bottom: 16px;
    }

    .cart-header h2 {
      font-size: 1.3rem;
      letter-spacing: 1px;
      color: #1a3b2b;
    }

    .cart-close {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #333;
      line-height: 1;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .cart-item-image {
      width: 55px;
      height: 55px;
      background: #eee;
      background-size: cover;
      background-position: center;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1a3b2b;
    }

    .cart-item-price {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .cart-item-controls button {
      background: #f0f0f0;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-item-controls button:hover {
      background: #ddd;
    }

    .cart-item-controls .qty {
      font-weight: 600;
      min-width: 20px;
      text-align: center;
    }

    .cart-item-remove {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 4px;
      transition: 0.2s;
    }

    .cart-item-remove:hover {
      color: #e74c3c;
    }

    .cart-footer {
      border-top: 1px solid #eee;
      padding-top: 16px;
      margin-top: 12px;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1a3b2b;
    }

    .cart-checkout {
      width: 100%;
      padding: 12px;
      background: #1a3b2b;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.5px;
    }

    .cart-checkout:hover {
      background: #2a5a3f;
    }

    .empty-cart {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 0;
    }

    .footer {
      background: #1a3b2b;
      color: rgba(255,255,255,0.8);
      padding: 30px 20px 20px;
      text-align: center;
      font-size: 0.85rem;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 24px;
      margin-bottom: 16px;
    }

    .footer-links a {
      color: rgba(255,255,255,0.7);
      transition: 0.2s;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    .footer-links a:hover {
      color: #ffffff;
    }

    .footer small {
      opacity: 0.6;
      font-size: 0.75rem;
    }

    .footer .credit {
      display: block;
      margin-top: 8px;
      opacity: 0.5;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
    }

    @media (max-width: 600px) {
      .cart-sidebar {
        width: 100%;
        max-width: 100%;
        right: -110%;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <button class="menu-btn" id="openMenu" aria-label="Open Navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <span class="est-tag">Est 2026</span>
    </div>
    <div class="logo">earthnic</div>
    <div class="header-right">
      <div class="cart-icon-wrapper" id="cartToggle">
        <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </div>
    </div>
  </header>

  <div class="nav-modal" id="navModal">
    <button class="close-btn" id="closeMenu" aria-label="Close Navigation">&times;</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="catalog.html">Catalog</a></li>
      <li><a href="contact.html">Contact Us</a></li>
      <li><a href="story.html">Our Story</a></li>
    </ul>
  </div>

  <div class="cart-overlay" id="cartOverlay"></div>
  <div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="cart-close" id="cartClose">&times;</button>
    </div>
    <div class="cart-items" id="cartItems">
      <div class="empty-cart">Your cart is empty.</div>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">R0</span>
      </div>
      <button class="cart-checkout" id="checkoutBtn">Checkout via WhatsApp</button>
    </div>
  </div>

  <main>
    <section class="catalog-section">
      <h2 class="section-title">Summer Collection</h2>
      <div class="product-grid" id="productGrid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="catalog.html">Catalog</a>
      <a href="contact.html">Contact</a>
      <a href="story.html">Story</a>
    </div>
    <small>&copy; 2026 earthnic · Timeless Apparel</small>
    <span class="credit">Developed by FactorX.co.za</span>
  </footer>

  <script>
    (function() {
      let cart = [];
      const CART_KEY = 'earthnic_cart';

      function loadCart() {
        try {
          const data = localStorage.getItem(CART_KEY);
          if (data) cart = JSON.parse(data);
        } catch (_) { cart = []; }
        cart = cart.filter(item => item && typeof item === 'object' && item.id);
        saveCart();
      }

      function saveCart() {
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
        renderCart();
        updateBadge();
      }

      function updateBadge() {
        const badge = document.getElementById('cartBadge');
        const total = cart.reduce((sum, item) => sum + item.qty, 0);
        badge.textContent = total;
        badge.style.display = total > 0 ? 'flex' : 'none';
      }

      function findItem(productId) {
        return cart.find(item => item.id === productId);
      }

      function addToCart(product) {
        const existing = findItem(product.id);
        if (existing) {
          existing.qty += 1;
        } else {
          cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            image: product.image,
            qty: 1
          });
        }
        saveCart();
        const btn = document.querySelector(`[data-product-id="${product.id}"]`);
        if (btn) {
          const orig = btn.textContent;
          btn.textContent = 'Added';
          setTimeout(() => { btn.textContent = orig; }, 1200);
        }
      }

      function removeItem(productId) {
        cart = cart.filter(item => item.id !== productId);
        saveCart();
      }

      function updateQty(productId, delta) {
        const item = findItem(productId);
        if (!item) return;
        item.qty += delta;
        if (item.qty <= 0) {
          removeItem(productId);
        } else {
          saveCart();
        }
      }

      function getTotal() {
        return cart.reduce((sum, item) => sum + parseFloat(item.price) * item.qty, 0);
      }

      function renderCart() {
        const container = document.getElementById('cartItems');
        const totalEl = document.getElementById('cartTotal');
        if (cart.length === 0) {
          container.innerHTML = '<div class="empty-cart">Your cart is empty.</div>';
          totalEl.textContent = 'R0';
          return;
        }
        let html = '';
        cart.forEach(item => {
          const priceNum = parseFloat(item.price);
          html += `
            <div class="cart-item">
              <div class="cart-item-image" style="background-image: url('${item.image}');"></div>
              <div class="cart-item-info">
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-price">R${priceNum.toFixed(2)}</div>
                <div class="cart-item-controls">
                  <button onclick="window.cartModule.updateQty('${item.id}', -1)">−</button>
                  <span class="qty">${item.qty}</span>
                  <button onclick="window.cartModule.updateQty('${item.id}', 1)">+</button>
                  <button class="cart-item-remove" onclick="window.cartModule.removeItem('${item.id}')">✕</button>
                </div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
        totalEl.textContent = `R${getTotal().toFixed(2)}`;
      }

      const cartModule = { addToCart, removeItem, updateQty };
      window.cartModule = cartModule;

      const openMenuBtn = document.getElementById('openMenu');
      const closeMenuBtn = document.getElementById('closeMenu');
      const navModal = document.getElementById('navModal');
      const navLinks = document.querySelectorAll('.nav-links a');

      openMenuBtn.addEventListener('click', () => {
        navModal.classList.add('active');
      });

      closeMenuBtn.addEventListener('click', () => {
        navModal.classList.remove('active');
      });

      navLinks.forEach(link => {
        link.addEventListener('click', () => {
          navModal.classList.remove('active');
        });
      });

      const products = [
        { id: 'p1', name: "Earthnic Sumner T.", price: 175, quality: "180 gsm Good quality", gender: "Unisex", image: "2.jpeg" },
        { id: 'p2', name: "D2E.", price: 175, quality: "180 gsm Good Quality", gender: "Male", image: "3.jpeg" },
        { id: 'p3', name: "Down2Earth 2.0v Summer T", price: 250, quality: "200 gsm Premium", gender: "Male", image: "4.jpeg" },
        { id: 'p4', name: "Archive The Feeling Summer.v", price: 250, quality: "200 gsm Premium", gender: "Male", image: "5.jpeg" },
        { id: 'p5', name: "Earthnic Archive Ace of Jorts", price: 450, quality: "12 oz Good Quality", gender: "Male", image: "6.jpeg" },
        { id: 'p6', name: "Earthnic Archive Summer Green", price: 300, quality: "240 gsm High premium", gender: "Unisex", image: "7.jpeg" },
        { id: 'p7', name: "Earthnic Archive White.", price: 350, quality: "240 gsm High premium", gender: "Unisex", image: "10.jpeg" }
      ];

      const grid = document.getElementById('productGrid');

      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-image" style="background-image: url('${p.image}');"></div>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-meta">
              <span class="product-price">R${p.price}</span>
              <span class="product-quality">${p.quality}</span>
            </div>
            <div>
              <span class="product-gender">${p.gender}</span>
            </div>
            <button class="btn-add" data-product-id="${p.id}">Add to cart</button>
          </div>
        `;
        grid.appendChild(card);
      });

      document.querySelectorAll('.btn-add').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const id = this.dataset.productId;
          const product = products.find(p => p.id === id);
          if (product) {
            cartModule.addToCart(product);
          }
        });
      });

      const cartToggle = document.getElementById('cartToggle');
      const cartSidebar = document.getElementById('cartSidebar');
      const cartOverlay = document.getElementById('cartOverlay');
      const cartClose = document.getElementById('cartClose');

      function openCart() {
        cartSidebar.classList.add('open');
        cartOverlay.classList.add('active');
        renderCart();
      }

      function closeCart() {
        cartSidebar.classList.remove('open');
        cartOverlay.classList.remove('active');
      }

      cartToggle.addEventListener('click', openCart);
      cartClose.addEventListener('click', closeCart);
      cartOverlay.addEventListener('click', closeCart);

      document.getElementById('checkoutBtn').addEventListener('click', function() {
        if (cart.length === 0) {
          alert('Your cart is empty!');
          return;
        }
        let message = 'Earthnic Order%0A%0A';
        cart.forEach(item => {
          const total = (parseFloat(item.price) * item.qty).toFixed(2);
          message += `${item.name} x ${item.qty} = R${total}%0A`;
        });
        const grandTotal = getTotal().toFixed(2);
        message += `%0ATotal: R${grandTotal}%0A%0AThank you!`;
        const url = `https://wa.me/27698530542?text=${message}`;
        window.open(url, '_blank');
      });

      loadCart();
      renderCart();
      updateBadge();
    })();
  </script>
</body>
</html>
